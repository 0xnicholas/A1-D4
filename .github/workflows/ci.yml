# CI(M1-02 #23;M5 修订见 ADR-0015):
# 硬闸门(红)= `pnpm verify`(typecheck / build / test / check:dist / 仅声明依赖红线);
# 黄灯(@ADR-0001:不卡合并)= 字节预算 + 依赖数字两步,以 GitHub 警告注释 + job summary 呈现。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 验证与轻量红线
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm(版本由 package.json 的 packageManager 固定)
        uses: pnpm/action-setup@v6

      - name: Setup Node(engines 基线 22.13.0:node:sqlite 免 flag 下限,ADR-0002 M5 修订;仍高于 require(esm) 下限)
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 硬闸门(typecheck / build / test / check:dist / 仅声明依赖红线)
        run: pnpm verify

      - name: 字节预算黄灯(ADR-0001:超预算不卡合并;口径/测量硬错误照常变红)
        # 退出码契约(ADR-0015):0 在预算内 / 1 超预算(黄灯,本步容忍)/ 2 硬错误(失败)
        run: pnpm check:byte-budget || test $? -eq 1

      - name: 依赖数字黄灯(ADR-0015 M5:传递包数/解包体积超基线不卡合并;口径/测量硬错误照常变红)
        # 退出码契约(ADR-0015):0 在基线内 / 1 超基线·缺基线·零引用(黄灯,本步容忍)/ 2 硬错误(失败)
        run: pnpm check:deps-budget || test $? -eq 1
